<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tree-sitter-http — how a grammar reads text</title>
<style>
  /* One text, one page scroll. Each step performs its own operation on the
     text that is there, and the text stays editable at every step. Colour is
     the package's own stylesheet — `CSS` from tree-sitter-http-web, filled into
     #shipped-css at boot and read through the --ts-* properties below — so
     the page is painted by the thing it documents, with the rules it ships. */
  :root {
    color-scheme: light dark;
    --line: 20px;
    --ground: #f6f6f7; --field: #ffffff; --ink: #16161a; --dim: #6a6a74;
    --edge: #dcdce0; --rule: #ebebee; --wash: #f1f1f3;
    --select: rgba(37, 99, 235, 0.18); --focus: #2563eb;
    --keyword: #9d174d; --string: #15803d; --string-special: #0e7490;
    --constant: #b45309; --property: #1d4ed8; --variable: #6d28d9;
    --variable-builtin: #a21caf; --variable-parameter: #4d7c0f;
    --comment: #8a8a93; --attribute: #b91c1c; --operator: #52525b;
    --punctuation: #52525b; --punctuation-special: #0f766e;
    --markup: #3f3f46; --label: #7c2d12;
    --error: #b91c1c; --error-bg: #fbe3e3; --good: #15803d;
    --tint: rgba(20, 20, 40, 0.085);
    --inject: rgba(13, 148, 136, 0.10); --opaque: rgba(180, 83, 9, 0.13);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    /* The package's colour hooks, every one its CSS reads, from this palette. */
    --ts-keyword: var(--keyword); --ts-string: var(--string);
    --ts-string-special: var(--string-special); --ts-constant: var(--constant);
    --ts-boolean: var(--constant); --ts-number: var(--constant);
    --ts-property: var(--property); --ts-punctuation: var(--punctuation);
    --ts-punctuation-special: var(--punctuation-special); --ts-operator: var(--operator);
    --ts-attribute: var(--attribute); --ts-variable: var(--variable);
    --ts-comment: var(--comment); --ts-escape: var(--punctuation-special);
    --ts-tag: var(--keyword); --ts-type: var(--constant); --ts-markup: var(--markup);
    --ts-error: var(--error);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101013; --field: #17171b; --ink: #e6e6ea; --dim: #8a8a95;
      --edge: #2c2c33; --rule: #222228; --wash: #1d1d22;
      --select: rgba(96, 165, 250, 0.24); --focus: #60a5fa;
      --keyword: #f472b6; --string: #4ade80; --string-special: #22d3ee;
      --constant: #fbbf24; --property: #93c5fd; --variable: #c4b5fd;
      --variable-builtin: #e879f9; --variable-parameter: #bef264;
      --comment: #6f6f78; --attribute: #f87171; --operator: #a1a1aa;
      --punctuation: #a1a1aa; --punctuation-special: #2dd4bf;
      --markup: #d4d4d8; --label: #fdba74;
      --error: #f87171; --error-bg: #45191b; --good: #4ade80;
      --tint: rgba(255, 255, 255, 0.085);
      --inject: rgba(45, 212, 191, 0.12); --opaque: rgba(251, 191, 36, 0.14);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 13px/1.55 var(--mono);
  }
  button, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  main { max-width: 150ch; margin: 0 auto; padding: 1.1rem 1.2rem 5rem; }

  /* The text and what this step made of it, side by side, both starting at the
     top. Only the page scrolls. */
  .work {
    display: grid; grid-template-columns: minmax(0, 54ch) minmax(0, 1fr);
    gap: 1.2rem; align-items: start;
  }
  @media (max-width: 1000px) { .work { grid-template-columns: none; } }
  .work > * { min-width: 0; }

  header {
    display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap;
    max-width: 150ch; margin: 0 auto; padding: .7rem 1.2rem;
    border-bottom: 1px solid var(--edge);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--dim); font-size: 12px; }
  header .right { margin-left: auto; display: flex; gap: .5rem; align-items: center; }

  select {
    background: var(--field); border: 1px solid var(--edge); border-radius: 4px;
    padding: .15rem .3rem; font-size: 12px; max-width: 34ch;
  }
  .choice {
    background: none; border: 1px solid var(--edge); padding: .2rem .55rem;
    cursor: pointer; color: var(--dim); font-size: 12px; border-radius: 4px;
  }
  #dialects .choice + .choice { border-left: 0; border-radius: 0 4px 4px 0; }
  #dialects .choice:first-child { border-radius: 4px 0 0 4px; }
  .choice[aria-pressed="true"] { color: var(--ink); background: var(--wash); font-weight: 600; }
  .choice:disabled { opacity: .4; cursor: not-allowed; }

  /* The steps are a sequence, so they are numbered and they run left to right. */
  #steps { display: flex; flex-wrap: wrap; align-items: center; gap: .1rem; margin: 0 0 .5rem; }
  .step {
    background: none; border: 0; cursor: pointer; color: var(--dim);
    font-size: 12px; padding: .2rem .45rem; border-bottom: 2px solid transparent;
  }
  .step i { font-style: normal; color: var(--edge); margin-right: .3rem; }
  .step:hover { color: var(--ink); }
  .step[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--keyword); }
  .step[aria-selected="true"] i { color: var(--keyword); }
  .arrow { color: var(--edge); font-size: 11px; }

  /* Where you are: the whole document, or the range another grammar owns that
     you have gone down into. Always one line, so going in moves nothing. */
  #trail {
    margin: 0 0 .6rem; display: flex; align-items: center; gap: .3rem; font-size: 12px;
    height: 1.8em; overflow: hidden; white-space: nowrap;
  }
  #trail button {
    background: var(--field); border: 1px solid var(--edge); border-radius: 4px;
    padding: .1rem .45rem; cursor: pointer; color: var(--dim); font-size: 12px;
  }
  #trail button:hover { color: var(--ink); }
  #trail .here { color: var(--ink); font-weight: 600; border-color: var(--keyword); }
  #trail .sep { color: var(--edge); }

  /* Fixed heights, so nothing a click or a step change does can move anything
     else: the caption is per step, the lead answers for the caret or the pick,
     the document view is one size at every step, the note under the text
     names the element. Each scrolls inside if it must. */
  #caption { margin: 0 0 .8rem; color: var(--ink); height: calc(2 * 1.55em); overflow: auto; max-width: 110ch; }
  .lead { height: calc(3 * 1.55em); overflow: auto; margin: 0 0 .6rem; }
  .lead p { margin: 0; }
  .pane { height: 12rem; overflow: auto; margin: 0 0 .5rem; }
  .pane table { margin: 0; }
  #caption b { font-weight: 600; }
  #caption .hint { color: var(--dim); }

  /* One editable block. The rendering under it sets the height, so the page is
     the only thing that scrolls. Under it, the same text in the package's own
     element, styled as a consumer would style it: the host is the box. */
  .field {
    position: relative; border: 1px solid var(--edge); border-radius: 5px;
    background: var(--field); overflow: hidden;
  }
  .field pre, .field textarea {
    margin: 0; padding: .7rem .8rem; border: 0; font: 13px/var(--line) var(--mono);
    white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4;
  }
  .field pre { position: static; color: var(--ink); min-height: calc(var(--line) * 3); }
  .field textarea {
    position: absolute; inset: 0; background: transparent; color: transparent;
    caret-color: var(--ink); resize: none; overflow: hidden; outline-offset: -2px;
  }
  .field textarea::selection { background: var(--select); }
  #shipped-note { margin: .9rem 0 .35rem; color: var(--dim); font-size: 12px; height: calc(2 * 1.55em); overflow: hidden; }
  #shipped-note b { color: var(--ink); }
  #shipped {
    border: 1px solid var(--edge); border-radius: 5px; background: var(--field); color: var(--ink);
    font: 13px/var(--line) var(--mono); --http-file-padding: .7rem .8rem;
    --http-file-selection: var(--select);
  }

  #result h3 {
    font-size: 12px; font-weight: 600; margin: 1rem 0 .4rem;
    padding-top: .45rem; border-top: 1px solid var(--rule);
  }
  #result h3:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  #result p { margin: 0 0 .5rem; color: var(--dim); max-width: 92ch; }
  #result .now { color: var(--ink); }
  code { background: var(--wash); padding: 0 .2em; border-radius: 2px; }

  table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 0 0 .5rem; }
  th { text-align: left; font-weight: 600; color: var(--dim); padding: .15rem .6rem .15rem 0;
       border-bottom: 1px solid var(--edge); white-space: nowrap; }
  td { padding: .1rem .6rem .1rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  td:last-child, th:last-child { padding-right: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.pick td { cursor: pointer; }
  tr.pick:hover td { background: var(--wash); }
  tr.on td { background: var(--select); }
  .scroll { overflow-x: auto; }

  pre.src {
    margin: 0 0 .5rem; padding: .4rem .6rem; background: var(--wash);
    border-left: 2px solid var(--edge); overflow-x: auto; font-size: 12px; white-space: pre-wrap;
  }
  .muted { color: var(--dim); }
  .warn { color: var(--error); }
  .ok { color: var(--good); }
  .pill { font-size: 11px; border: 1px solid var(--edge); border-radius: 3px; padding: 0 .3em;
         color: var(--dim); white-space: nowrap; display: inline-block; margin: 0 .15rem .2rem 0; }
  .pill.pick { cursor: pointer; }
  .pill.pick:hover { color: var(--ink); border-color: var(--dim); }
  .swatch { display: inline-block; width: .7em; height: .7em; border-radius: 2px; margin: 0 .3em 0 .25em;
            vertical-align: -0.05em; outline: 1px solid var(--edge); outline-offset: -1px; }

  /* A document a step stands in — the query, the stylesheet — built like the
     text: a mirror the applicable ranges are marked in (under a transparent
     textarea when it is editable) and a wrapper that scrolls to them. The
     document never moves; the marks do. */
  .doc {
    height: 22rem; overflow: auto; border: 1px solid var(--edge); border-radius: 4px;
    background: var(--wash); margin: 0 0 .5rem;
  }
  .doc table { margin: 0; }
  .doc .scroll { overflow: visible; }
  /* One row per stage, each a box with room for what it says to wrap: a fixed
     height, so no row under it moves. */
  .chain table { table-layout: fixed; width: 100%; }
  .chain td { height: calc(3 * 1.55em); vertical-align: top; overflow: hidden; }
  .chain td:first-child, .chain th:first-child { width: 8em; }
  .doc .field { border: 0; border-radius: 0; background: transparent; }
  .doc pre, .doc textarea {
    margin: 0; font: 12px/1.5 var(--mono); padding: .5rem; tab-size: 2;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink);
  }
  .doc pre { min-height: 0; }

  details { border-top: 1px solid var(--rule); padding: .5rem 0 0; margin-top: 1.4rem; }
  summary { cursor: pointer; font-weight: 600; font-size: 12px; color: var(--dim); }
  summary:hover { color: var(--ink); }
  details details { margin-top: .8rem; }

  footer {
    max-width: 150ch; margin: 0 auto; padding: .35rem 1.2rem 1.2rem;
    color: var(--dim); font-size: 11px; display: flex; flex-wrap: wrap; gap: .1rem;
  }
  footer span { padding-right: .7rem; margin-right: .7rem; border-right: 1px solid var(--rule); white-space: nowrap; }
  footer span:last-child { border-right: 0; }
  footer b { font-weight: 600; color: var(--ink); }
  footer b.warn { color: var(--error); }

  /* What each step draws over the text. */
  .hl .tok { box-shadow: inset 1.5px 0 0 0 var(--ink); }
  .hl .alt { background: rgba(20, 20, 40, .17); }
  .hl .d1, .hl .d2, .hl .d3, .hl .d4, .hl .d5 { border-radius: 2px; }
  .hl .ws { border-bottom: 1px dotted var(--dim); }
  .hl .d1 { background: rgba(37, 99, 235, .07); }
  .hl .d2 { background: rgba(37, 99, 235, .15); }
  .hl .d3 { background: rgba(37, 99, 235, .24); }
  .hl .d4 { background: rgba(37, 99, 235, .33); }
  .hl .d5 { background: rgba(37, 99, 235, .42); }
  .hl .cap {
    outline: 1px solid var(--keyword); outline-offset: -1px; border-radius: 2px;
    background: rgba(157, 23, 77, .09);
  }
  .hl .flat { color: var(--dim); opacity: .45; }
  .hl .sel { background: var(--select); outline: 1px solid var(--focus); outline-offset: -1px; border-radius: 2px; }
  .hl .inject { background: var(--inject); }
  .hl .opaque { background: var(--opaque); }
  .hl .bad { background: var(--error-bg); }
  /* A range in a document on the right that can be picked: "where are these?" */
  .hl .pick { cursor: pointer; }
  .hl .pick:hover { outline: 1px dashed var(--dim); outline-offset: -1px; border-radius: 2px; }

  /* Capture name -> CSS class is the package's `CSS`, in #shipped-css: a
     dotted name splits into a class list, and its rules answer every capture
     name the four highlight queries can produce (check.js fails otherwise). */

  @media (prefers-color-scheme: dark) {
    .hl .alt { background: rgba(255, 255, 255, .17); }
    .hl .d1 { background: rgba(96, 165, 250, .09); }
    .hl .d2 { background: rgba(96, 165, 250, .18); }
    .hl .d3 { background: rgba(96, 165, 250, .27); }
    .hl .d4 { background: rgba(96, 165, 250, .36); }
    .hl .d5 { background: rgba(96, 165, 250, .45); }
  }

  #boot { max-width: 150ch; margin: 0 auto; padding: 1rem 1.2rem; color: var(--error); }
</style>
<style id="shipped-css"></style>
<!-- The package, by the name a consumer imports it under. Each entry is one of
     package.json's exports, mapped to the same file; check.js holds the two
     to each other. -->
<script type="importmap">
{
  "imports": {
    "tree-sitter-http-web": "./vendor/tree-sitter-http-web/index.js",
    "tree-sitter-http-web/element": "./vendor/tree-sitter-http-web/element.js",
    "tree-sitter-http-web/painter": "./vendor/tree-sitter-http-web/painter.js",
    "tree-sitter-http-web/grammars": "./vendor/tree-sitter-http-web/grammars.js",
    "tree-sitter-http-web/dist/": "./vendor/tree-sitter-http-web/dist/"
  }
}
</script>
</head>
<body>
<header>
  <h1>tree-sitter-http</h1>
  <p>how a grammar reads text</p>
  <span class="right">
    <select id="examples" aria-label="example"></select>
    <button class="choice" id="reset" title="put the example back as it was">reset</button>
    <nav id="dialects" aria-label="dialect"></nav>
  </span>
</header>
<main>
  <nav id="steps" role="tablist" aria-label="step"></nav>
  <p id="caption"></p>
  <nav id="trail" aria-label="where you are"></nav>
  <div class="work">
    <div>
      <div class="field" id="field">
        <pre class="hl" id="output" aria-hidden="true"></pre>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" aria-label="the text"></textarea>
      </div>
      <p id="shipped-note"></p>
      <http-file id="shipped" aria-label="the text, as the package paints it"></http-file>
    </div>
    <div id="result" role="region" aria-live="polite"></div>
  </div>
  <details id="grammar-ref"><summary>the grammar, as generated</summary><div id="grammar-body"></div></details>
  <details id="corpus-ref"><summary>the corpus, run here</summary><div id="corpus-body"></div></details>
</main>
<footer id="status"></footer>
<p id="boot" hidden></p>

<script type="module">
  // Reaching here means the module graph linked, so the import map resolved.
  document.documentElement.dataset.booted = "1";
  import { start } from "./ui.js";
  start().catch((error) => {
    const boot = document.getElementById("boot");
    boot.hidden = false;
    boot.textContent = `${error.message} — run the build (npm run build -w web) and serve web/dist/`;
    throw error;
  });
</script>
<script>
  // A module that fails to *link* never runs, so the handler above cannot
  // report it and the page would sit blank. The usual cause is serving web/
  // itself rather than the built web/dist/, which has no vendor/ for the
  // import map to reach. Say that, instead of nothing.
  addEventListener("load", () => setTimeout(() => {
    if (document.documentElement.dataset.booted) return;
    const boot = document.getElementById("boot");
    boot.hidden = false;
    boot.textContent =
      "the page's modules did not load. This page is built: run npm run build -w web, "
      + "then serve web/dist/, not web/.";
  }, 500));
</script>
</body>
</html>
