# main deploys the guide to GitHub Pages as parse.req.to. The guide's build
# vendors the web package from the tree, so the published guide is the grammar
# as it stands here — it documents the repository, not a release, and a site
# change never costs consumers a version. Pages is set to deploy from Actions
# in the repository's settings; the DNS is a CNAME from parse to
# x-amz.github.io. npm is upgraded to the same one the publish workflow uses;
# see ci.yml.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time: concurrent deploy-pages runs collide.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 4.0.4
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run check -w web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
